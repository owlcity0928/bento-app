<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>便當統計系統 - 多工班視覺化與 Excel 匯出</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS (xlsx) CDN 用於一鍵匯出 Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    input, select { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="bg-amber-500 text-slate-900 font-black px-2 py-1 rounded text-lg">🍱</span>
        <h1 class="font-bold text-base sm:text-xl tracking-wide">便當統計系統</h1>
      </div>
      <div class="flex items-center gap-2">
        <!-- 一鍵匯出 Excel 按鈕 -->
        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs sm:text-sm shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-excel"></i> 匯出 Excel
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-4 space-y-5">

    <!-- 1. 全場當日總計 KPI Cards -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <span class="text-xs font-semibold text-slate-400">當天全場總數量</span>
        <div class="mt-2 flex items-baseline justify-between">
          <span id="kpiTodayCount" class="text-3xl font-extrabold text-amber-600">0</span>
          <span class="text-xs text-slate-500 font-medium">個</span>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <span class="text-xs font-semibold text-slate-400">當天全場總金額</span>
        <div class="mt-2 flex items-baseline justify-between">
          <span id="kpiTodayAmount" class="text-3xl font-extrabold text-emerald-600">0</span>
          <span class="text-xs text-slate-500 font-medium">元</span>
        </div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <span class="text-xs font-semibold text-slate-400">當天進場工班數</span>
        <div class="mt-2 flex items-baseline justify-between">
          <span id="kpiTodaySubCount" class="text-3xl font-extrabold text-blue-600">0</span>
          <span class="text-xs text-slate-500 font-medium">組</span>
        </div>
      </div>
      <div class="bg-slate-800 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between">
        <span class="text-xs font-semibold text-slate-400">累積歷史紀錄</span>
        <div class="mt-2 flex items-baseline justify-between">
          <span id="kpiTotalRecords" class="text-3xl font-extrabold text-amber-400">0</span>
          <span class="text-xs text-slate-400">筆</span>
        </div>
      </div>
    </section>

    <!-- 2. 當日各廠商/工班視覺化圖表與拆解明細 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h2 class="text-base font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-chart-pie text-amber-500 mr-2"></i>當天各廠商統計分析
        </h2>
        <span id="currentDateBadge" class="text-xs font-bold bg-amber-100 text-amber-800 px-2 py-1 rounded-md">--</span>
      </div>

      <!-- 圖表區 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
          <p class="text-xs font-bold text-slate-500 text-center mb-2">各工班便當數量佔比 (個)</p>
          <div class="relative h-44 w-full flex justify-center items-center">
            <canvas id="qtyChart"></canvas>
          </div>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
          <p class="text-xs font-bold text-slate-500 text-center mb-2">各工班費用小計 (元)</p>
          <div class="relative h-44 w-full flex justify-center items-center">
            <canvas id="amountChart"></canvas>
          </div>
        </div>
      </div>

      <!-- 當天各廠商細分卡片 -->
      <div>
        <h3 class="text-xs font-bold text-slate-500 mb-2">當日進場廠商明細拆解：</h3>
        <div id="subcontractorBreakdown" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <!-- JS 自動渲染 -->
        </div>
      </div>
    </section>

    <!-- 3. 新增紀錄表單 -->
    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <h2 class="text-base font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center">
        <i class="fa-solid fa-pen-to-square text-blue-600 mr-2"></i>登記工班便當
      </h2>

      <form id="bentoForm" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- 日期 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">日期</label>
            <input type="date" id="inputDate" required onchange="updateDashboard()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 font-semibold text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none">
          </div>

          <!-- 工區地點 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">工區 / 地點</label>
            <input type="text" id="inputLocation" placeholder="例如：銅科信邦、A棟3F" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 font-semibold text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none">
          </div>

          <!-- 便當店家 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">便當店家 / 店名</label>
            <input type="text" id="inputStore" placeholder="例如：昇光、正忠排骨" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 font-semibold text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none">
          </div>

          <!-- 廠商/工班名稱 (文字輸入框 + 常用標籤) -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">廠商 / 工班名稱 (誰吃的)</label>
            <input type="text" id="inputSubcontractor" placeholder="例如：管媽媽、模板組" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 font-semibold text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none">
            
            <!-- 常用廠商快速標籤 -->
            <div class="flex flex-wrap gap-1.5 mt-2">
              <button type="button" onclick="setSubcontractor('管媽媽')" class="text-xs bg-slate-200 hover:bg-amber-500 hover:text-white font-bold text-slate-700 px-2 py-1 rounded-lg transition">管媽媽</button>
              <button type="button" onclick="setSubcontractor('模板組')" class="text-xs bg-slate-200 hover:bg-amber-500 hover:text-white font-bold text-slate-700 px-2 py-1 rounded-lg transition">模板組</button>
              <button type="button" onclick="setSubcontractor('鋼筋組')" class="text-xs bg-slate-200 hover:bg-amber-500 hover:text-white font-bold text-slate-700 px-2 py-1 rounded-lg transition">鋼筋組</button>
              <button type="button" onclick="setSubcontractor('水電組')" class="text-xs bg-slate-200 hover:bg-amber-500 hover:text-white font-bold text-slate-700 px-2 py-1 rounded-lg transition">水電組</button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
          <!-- 數量設定 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">該工班數量 (個)</label>
            <div class="flex items-center space-x-2">
              <button type="button" onclick="adjustQty(-1)" class="w-12 h-12 bg-slate-100 active:bg-slate-200 border border-slate-300 rounded-xl text-xl font-black text-slate-700 flex items-center justify-center shrink-0">-</button>
              <input type="number" id="inputQty" value="5" min="1" required oninput="calcTotal()" class="w-full text-center bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xl font-black text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none">
              <button type="button" onclick="adjustQty(1)" class="w-12 h-12 bg-amber-500 active:bg-amber-600 text-white rounded-xl text-xl font-black flex items-center justify-center shrink-0 shadow-sm">+</button>
            </div>
          </div>

          <!-- 單價選擇 -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">便當單價 (元)</label>
            <div class="grid grid-cols-4 gap-1.5 mb-1.5">
              <button type="button" onclick="setUnitPrice(80)" class="py-1.5 bg-slate-100 focus:bg-amber-500 focus:text-white border border-slate-200 rounded-lg font-bold text-slate-700 text-xs">80</button>
              <button type="button" onclick="setUnitPrice(90)" class="py-1.5 bg-slate-100 focus:bg-amber-500 focus:text-white border border-slate-200 rounded-lg font-bold text-slate-700 text-xs">90</button>
              <button type="button" onclick="setUnitPrice(100)" class="py-1.5 bg-slate-100 focus:bg-amber-500 focus:text-white border border-slate-200 rounded-lg font-bold text-slate-700 text-xs">100</button>
              <button type="button" onclick="setUnitPrice(120)" class="py-1.5 bg-slate-100 focus:bg-amber-500 focus:text-white border border-slate-200 rounded-lg font-bold text-slate-700 text-xs">120</button>
            </div>
            <input type="number" id="inputUnitPrice" value="90" required oninput="calcTotal()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-semibold text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none">
          </div>
        </div>

        <!-- 付款方式 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">付款方式</label>
          <select id="inputPayment" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 font-semibold text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none">
            <option value="代墊/扣款">代墊 / 扣款</option>
            <option value="包商自付/現金">包商自付 / 現金</option>
            <option value="月結/扣保留款">月結 / 扣保留款</option>
          </select>
        </div>

        <!-- 自動小計與送出 -->
        <div class="bg-slate-900 text-white rounded-2xl p-4 flex items-center justify-between mt-2">
          <div>
            <span class="text-xs text-slate-400 block">該工班費用小計</span>
            <span class="text-2xl font-black text-amber-400">$ <span id="displayTotal">450</span></span>
          </div>
          <button type="submit" id="submitBtn" class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-black px-6 py-3 rounded-xl text-base shadow-lg transition flex items-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> 寫入紀錄
          </button>
        </div>
      </form>
    </section>

  </main>

  <script>
    // ⚙️ 正式 Google Form 串接設定
    const GOOGLE_CONFIG = {
      formUrl: "https://docs.google.com/forms/d/e/1FAIpQLSdBmUT_p7hND6OsNBr8aAJson_dEe1u53ui_jx0tJ9X7YONPw/formResponse",
      entries: {
        date: "entry.1230768809",          // 日期
        location: "entry.2039748234",     // 工區地點
        store: "entry.2095738887",        // 便當店家
        subcontractor: "entry.497629936", // 廠商/工班名稱
        quantity: "entry.1217894018",     // 數量
        unitPrice: "entry.91820285",      // 單價
        payment: "entry.1064110417"       // 付款方式
      }
    };

    let localRecords = JSON.parse(localStorage.getItem('bento_records_v5') || '[]');
    let qtyChartInstance = null;
    let amountChartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputDate').valueAsDate = new Date();
      calcTotal();
      initCharts();
      updateDashboard();
    });

    function setSubcontractor(name) {
      document.getElementById('inputSubcontractor').value = name;
    }

    function adjustQty(delta) {
      const input = document.getElementById('inputQty');
      let val = parseInt(input.value) || 1;
      val = Math.max(1, val + delta);
      input.value = val;
      calcTotal();
    }

    function setUnitPrice(price) {
      document.getElementById('inputUnitPrice').value = price;
      calcTotal();
    }

    function calcTotal() {
      const qty = parseInt(document.getElementById('inputQty').value) || 0;
      const price = parseInt(document.getElementById('inputUnitPrice').value) || 0;
      document.getElementById('displayTotal').innerText = (qty * price).toLocaleString();
    }

    document.getElementById('bentoForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 上傳中...`;

      const formData = {
        date: document.getElementById('inputDate').value,
        location: document.getElementById('inputLocation').value.trim(),
        store: document.getElementById('inputStore').value.trim(),
        subcontractor: document.getElementById('inputSubcontractor').value.trim(),
        quantity: parseInt(document.getElementById('inputQty').value),
        unitPrice: parseInt(document.getElementById('inputUnitPrice').value),
        payment: document.getElementById('inputPayment').value
      };

      // 1. 本機快取更新
      localRecords.unshift(formData);
      localStorage.setItem('bento_records_v5', JSON.stringify(localRecords));
      updateDashboard();

      // 2. 背景同步傳送到 Google Form
      try {
        const googleFormData = new FormData();
        googleFormData.append(GOOGLE_CONFIG.entries.date, formData.date);
        googleFormData.append(GOOGLE_CONFIG.entries.location, formData.location);
        googleFormData.append(GOOGLE_CONFIG.entries.store, formData.store);
        googleFormData.append(GOOGLE_CONFIG.entries.subcontractor, formData.subcontractor);
        googleFormData.append(GOOGLE_CONFIG.entries.quantity, formData.quantity);
        googleFormData.append(GOOGLE_CONFIG.entries.unitPrice, formData.unitPrice);
        googleFormData.append(GOOGLE_CONFIG.entries.payment, formData.payment);

        await fetch(GOOGLE_CONFIG.formUrl, {
          method: 'POST',
          mode: 'no-cors',
          body: googleFormData
        });
      } catch (err) {
        console.log("已記錄於本機，雲端背景同步中");
      }

      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 寫入紀錄`;
      document.getElementById('inputSubcontractor').value = '';
      document.getElementById('inputQty').value = 5;
      calcTotal();
    });

    // 一鍵匯出 Excel 功能
    function exportToExcel() {
      if (localRecords.length === 0) {
        alert("目前沒有任何紀錄可供匯出！");
        return;
      }

      const excelData = localRecords.map(r => ({
        "日期": r.date,
        "工區地點": r.location,
        "便當店家": r.store,
        "工班/廠商": r.subcontractor,
        "數量 (個)": r.quantity,
        "單價 (元)": r.unitPrice,
        "總價 (元)": r.quantity * r.unitPrice,
        "付款方式": r.payment
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "便當明細");

      XLSX.writeFile(workbook, `便當統計報表_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    function updateDashboard() {
      const selectedDate = document.getElementById('inputDate').value;
      document.getElementById('currentDateBadge').innerText = selectedDate || '當天';

      const todayRecords = localRecords.filter(r => r.date === selectedDate);

      const todayTotalQty = todayRecords.reduce((sum, r) => sum + r.quantity, 0);
      const todayTotalAmount = todayRecords.reduce((sum, r) => sum + (r.quantity * r.unitPrice), 0);

      const subMap = {};
      todayRecords.forEach(r => {
        if (!subMap[r.subcontractor]) {
          subMap[r.subcontractor] = { quantity: 0, amount: 0, store: r.store, location: r.location, payment: r.payment };
        }
        subMap[r.subcontractor].quantity += r.quantity;
        subMap[r.subcontractor].amount += (r.quantity * r.unitPrice);
      });

      const uniqueSubCount = Object.keys(subMap).length;

      document.getElementById('kpiTodayCount').innerText = todayTotalQty;
      document.getElementById('kpiTodayAmount').innerText = todayTotalAmount.toLocaleString();
      document.getElementById('kpiTodaySubCount').innerText = uniqueSubCount;
      document.getElementById('kpiTotalRecords').innerText = localRecords.length;

      renderSubcontractorCards(subMap);
      updateCharts(subMap);
    }

    function renderSubcontractorCards(subMap) {
      const container = document.getElementById('subcontractorBreakdown');
      const keys = Object.keys(subMap);

      if (keys.length === 0) {
        container.innerHTML = `<div class="col-span-2 text-center py-6 text-slate-400 text-xs">當天尚無進場廠商紀錄</div>`;
        return;
      }

      const colors = ['border-l-amber-500', 'border-l-emerald-500', 'border-l-blue-500', 'border-l-purple-500', 'border-l-rose-500'];

      container.innerHTML = keys.map((subName, index) => {
        const item = subMap[subName];
        const borderBg = colors[index % colors.length];
        return `
          <div class="bg-slate-50 border border-slate-200 border-l-4 ${borderBg} rounded-xl p-3 flex justify-between items-center shadow-2xs">
            <div>
              <div class="font-black text-slate-800 text-sm flex items-center gap-1.5">
                ${subName}
                <span class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-normal">${item.payment}</span>
              </div>
              <div class="text-xs text-slate-500 mt-1">
                店家：<span class="font-semibold text-slate-700">${item.store}</span> | 位置：${item.location}
              </div>
            </div>
            <div class="text-right shrink-0">
              <div class="font-black text-amber-600 text-base">${item.quantity} 個</div>
              <div class="text-xs font-bold text-slate-700">$${item.amount.toLocaleString()} 元</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function initCharts() {
      const colorPalette = ['#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#64748b'];

      const ctxQty = document.getElementById('qtyChart').getContext('2d');
      qtyChartInstance = new Chart(ctxQty, {
        type: 'doughnut',
        data: { labels: [], datasets: [{ data: [], backgroundColor: colorPalette }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } }
      });

      const ctxAmt = document.getElementById('amountChart').getContext('2d');
      amountChartInstance = new Chart(ctxAmt, {
        type: 'bar',
        data: { labels: [], datasets: [{ label: '金額 (元)', data: [], backgroundColor: '#10b981' }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { font: { size: 9 } } }, x: { ticks: { font: { size: 10 } } } }
        }
      });
    }

    function updateCharts(subMap) {
      const labels = Object.keys(subMap);
      const qtys = labels.map(k => subMap[k].quantity);
      const amounts = labels.map(k => subMap[k].amount);

      qtyChartInstance.data.labels = labels;
      qtyChartInstance.data.datasets[0].data = qtys;
      qtyChartInstance.update();

      amountChartInstance.data.labels = labels;
      amountChartInstance.data.datasets[0].data = amounts;
      amountChartInstance.update();
    }
  </script>
</body>
</html>
